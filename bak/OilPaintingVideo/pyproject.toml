[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oilpaint-video"
version = "0.1.0"
description = "经典油画风格剧情短视频生成器：LLM 剧本 + ComfyUI 图生视频 + ffmpeg 自动剪辑"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OilPaint Video" }]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
mesh2video = [
    "trimesh>=4.0",
    "numpy>=1.24",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
]

[project.scripts]
oilpaint = "oilpaint.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"oilpaint.comfy" = ["templates/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
