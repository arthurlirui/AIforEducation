[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oilpainting-revive"
version = "0.1.0"
description = "油画动态艺术再创造系统：2DGS + 骨架绑定 + LTX-Video IC-LoRA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "pydantic>=2.6",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
torch = ["torch>=2.1", "torchvision"]
gs = ["plyfile>=0.9", "tqdm>=4.65"]

[project.scripts]
oilrev = "oilrev.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
